name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Format-valid dummy: Clerk parses the key at build time, so a bare placeholder
      # fails `next build` while prerendering /_not-found.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  contract:
    # The API repo commits openapi.json; this proves the generated client is in sync with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mirza-shafi/hirebridge-api
          path: hirebridge-api
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated types match the API schema
        run: |
          npm run api:types
          git diff --exit-code src/lib/api/schema.d.ts \
            || { echo '::error::schema.d.ts is stale — run `npm run api:types` and commit it'; exit 1; }
